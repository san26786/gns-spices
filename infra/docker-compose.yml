services:
  postgres:
    image: postgres:16-alpine
    container_name: gns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gns
      POSTGRES_PASSWORD: gns
      POSTGRES_DB: gns
    ports:
      - "5432:5432"
    volumes:
      - gns_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gns"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gns-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gns_redis_data:/data

volumes:
  gns_pg_data:
  gns_redis_data:
